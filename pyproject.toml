[project]
name = "rakshak"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "google-adk>=2.11",
    "google-genai>=2.29",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54",
]

[project.optional-dependencies]
gcp = [
    "google-cloud-bigquery>=3.46.1",
    "google-cloud-firestore>=2.34.1",
    "google-cloud-pubsub>=2.42.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]
